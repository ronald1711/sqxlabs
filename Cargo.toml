[workspace]
resolver = "2"
members = [
  "crates/sqx-core",
  "crates/sqx-indicators",
  "crates/sqx-strategy",
  "crates/sqx-backtest",
  "crates/sqx-metrics",
  "crates/sqx-optimizer",
  "crates/sqx-project",
  "crates/sqx-export",
  "crates/sqx-robustness",
  "crates/sqx-web",
  "crates/sqx-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
