name: Reliability
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        profile: [debug, release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Verify workspace and backup transport
        run: bash ci/check.sh '${{ matrix.profile }}'
      - name: Compare debug and release research traces
        if: matrix.profile == 'release'
        run: |
          rustup run 1.100.0 cargo build -p sqx-cli --locked
          node ci/check-profile-parity.cjs target/debug/sqx-cli target/release/sqx-cli
